apiVersion: tekton.dev/v1
kind: Task
metadata: {name: build-task}
spec:
  params: [{name: APP, type: string}]
  steps:
  - name: build
    image: quay.io/openshift/origin-cli:4.18
    script: |
      # BUG: this references a non-existent BuildConfig name.
      oc start-build $(params.APP)-broken --follow
---
apiVersion: tekton.dev/v1
kind: Task
metadata: {name: deploy-task}
spec:
  params: [{name: APP, type: string}]
  steps:
  - name: deploy
    image: quay.io/openshift/origin-cli:4.18
    script: |
      # BUG: this references a non-existent Deployment name.
      oc rollout status deployment/$(params.APP)-broken --timeout=180s
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata: {name: build-pipeline}
spec:
  params: [{name: APP, type: string}]
  tasks:
  - name: build
    # BUG: taskRef points to the wrong Task name.
    taskRef: {name: build-task-wrong}
    params: [{name: APP, value: '$(params.APP)'}]
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata: {name: deploy-pipeline}
spec:
  params: [{name: APP, type: string}]
  tasks:
  - name: deploy
    taskRef: {name: deploy-task}
    params: [{name: APP, value: '$(params.APP)'}]
